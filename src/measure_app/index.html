<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수기 입력 vs AI 보조 측정</title>
<style>
:root {
  --bg: #f4f6f8; --surface: #fff; --ink: #18212d; --muted: #5a6573; --rule: #d3d9e0; --head: #e9edf2;
  --accent: #2a4b7c; --accent-ink: #fff; --yellow: #fff2cc; --yellow-rule: #e6c35c; --lock: #eceff3;
  --pass: #1d7348; --pass-bg: #e3f2ea; --fail: #b0352d; --fail-bg: #f8e5e3; --warn: #8a5a00; --warn-bg: #fbf0d9;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171e; --surface: #1a212b; --ink: #e6eaf0; --muted: #a0aab7; --rule: #2f3946; --head: #222b37;
    --accent: #8fb0e3; --accent-ink: #12171e; --yellow: #4a3f16; --yellow-rule: #9a8030; --lock: #222b37;
    --pass: #6fd19e; --pass-bg: #17362a; --fail: #f08a80; --fail-bg: #3d1f1d; --warn: #f0c46a; --warn-bg: #3a2e14;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); word-break: keep-all; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
h1 { font-size: 1.5rem; margin: 0; } h2 { font-size: 1.15rem; margin: 0; } h3 { font-size: 1rem; margin: 0; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 8px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.big { padding: 14px 28px; font-size: 1.1rem; }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input { font: inherit; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
input[readonly] { background: var(--lock); color: var(--muted); }
label { display: grid; gap: 4px; font-weight: 600; }
.chip { display: inline-block; font-size: .78rem; font-weight: 700; padding: 1px 10px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.chip.pass { color: var(--pass); background: var(--pass-bg); } .chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.none { color: var(--muted); } .chip.fail { color: var(--fail); background: var(--fail-bg); }
.task { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.task .note { grid-column: 1 / -1; color: var(--warn); font-size: .88rem; }
.err { color: var(--fail); background: var(--fail-bg); padding: 10px 12px; border-radius: 6px; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.timer { font: 600 1.8rem/1 ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.doc { background: #fff; border: 1px solid var(--rule); border-radius: 6px; width: 100%; display: block; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 380px; }
th, td { padding: 4px; border-bottom: 1px solid var(--rule); text-align: left; }
th { background: var(--head); font-size: .85rem; padding: 6px; }
tr.flag td { background: var(--yellow); } tr.flag input { border-color: var(--yellow-rule); }
tr.lock td { background: var(--lock); }
th:first-child, td:first-child { width: 36%; }
td.act { width: 58px; text-align: center; }
td.act button { padding: 6px 8px; }
.cover { position: relative; }
.cover.paused > * { visibility: hidden; }
.cover.paused::after { content: "일시정지 중입니다. 계속을 누르면 서류가 다시 보입니다."; visibility: visible; position: absolute; inset: 0;
  display: grid; place-items: center; text-align: center; padding: 24px; background: var(--head); border-radius: 8px; min-height: 160px; }
pre { margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
.legend span { display: inline-block; padding: 1px 8px; border-radius: 4px; margin-right: 8px; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">불러오는 중…</p></div>
<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "poc-measure-current";
const MANUAL = "수기", ASSISTED = "AI보조";
let S = null;      // 서버 상태
let cur = null;    // 지금 하는 작업
let tick = null;
let flash = "";    // 화면 위에 잠깐 보이는 안내

const NO_SERVER = "앱 서버에 연결할 수 없습니다. 앱을 켠 터미널이 꺼졌는지 확인하세요. 꺼졌다면 다시 실행(python -X utf8 -W ignore src/measure_app.py)한 뒤 이 화면을 새로고침하면 됩니다. 입력하던 내용은 이 화면에 남아 있습니다.";
async function api(path, body) {
  let r;
  try {
    r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) { throw new Error(NO_SERVER); }  // 서버가 꺼졌을 때 브라우저는 'Failed to fetch'만 알려 준다
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("오류 " + r.status));
  return j;
}
const ago = h => h < 1 ? Math.max(1, Math.round(h * 60)) + "분" : h.toFixed(1) + "시간";
const fmt = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const elapsed = () => cur.acc + (cur.phase === "running" ? Date.now() - cur.startAt : 0);
const save = () => { try { if (cur) localStorage.setItem(KEY, JSON.stringify({ ...cur, lastTick: Date.now() })); else localStorage.removeItem(KEY); } catch (e) {} };

/* ---------- 홈 ---------- */
function home() {
  clearInterval(tick); cur = null; save();
  const app = document.getElementById("app");
  if (!S.person || S.target_ratio == null) {
    app.innerHTML = `
      <h1>수기 입력 vs AI 보조 측정</h1>
      <div class="card">
        <h2>먼저 두 가지를 정합니다</h2>
        <p class="muted">같은 서류 8장을 수기 입력과 AI 보조 검토로 한 번씩 처리하면서 시간과 틀린 칸을 잽니다. 결과를 보기 전에 목표를 정해야 판단이 흔들리지 않습니다.</p>
        <label>측정자 (별명도 됩니다. 한 사람이 끝까지 재는 것이 좋습니다)
          <input id="person" autocomplete="off" placeholder="예: 사장님"></label>
        <label>목표 시간 비율: AI 보조 시간의 중앙값 ÷ 수기 시간의 중앙값이 이 값 이하이면 목표 달성
          <input id="target" inputmode="decimal" autocomplete="off" placeholder="예: 0.7 (수기의 70% 이하)"></label>
        <p class="small muted">첫 측정을 마치면 이 값은 바꿀 수 없습니다. 오류 조건(AI 보조의 틀린 칸이 수기보다 늘지 않음)은 목표에 항상 같이 적용됩니다.</p>
        <div id="setupErr"></div>
        <div><button class="primary big" id="saveSetup">저장하고 시작</button></div>
      </div>`;
    document.getElementById("saveSetup").onclick = async () => {
      try { S = await api("/api/setup", { person: document.getElementById("person").value, target_ratio: document.getElementById("target").value }); home(); }
      catch (e) { document.getElementById("setupErr").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
    return;
  }
  const days = [1, 2].map(d => {
    const ts = S.tasks.filter(t => t.day === d);
    const rows = ts.map(t => {
      const note = t.warn && !t.done ? `<div class="note">이 서류를 다른 방식으로 ${ago(t.other_done_hours)} 전에 쟀습니다. 기억이 남아 있을 수 있으니 ${S.warn_hours}시간 이상 지난 뒤(내일)에 하는 것을 권합니다. 지금 해도 간격이 기록에 남습니다.</div>` : "";
      return `<div class="task"><div><b>${esc(t.doc.replace("명세서_", "명세서 "))}</b> <span class="muted">· ${t.group}조</span></div>
        <span class="chip ${t.method === MANUAL ? "none" : "warn"}">${t.method === MANUAL ? "수기 입력" : "AI 보조"}</span>
        <div>${t.done ? `<span class="chip pass">완료 ${Math.round(t.seconds)}초</span> <button data-redo="${esc(t.id)}">다시 하기</button>` : `<button class="primary" data-start="${esc(t.id)}">시작</button>`}</div>${note}</div>`;
    }).join("");
    const mm = ts.filter(t => t.method === MANUAL).length ? "수기" : "";
    return `<div class="card"><h2>${d}일차</h2><p class="small muted">${d === 1 ? "X조는 수기 입력, Y조는 AI 보조" : "X조는 AI 보조, Y조는 수기 입력"}. 1일차와 2일차는 하루 이상 띄우는 것이 좋습니다.</p>${rows}</div>`;
  }).join("");
  app.innerHTML = `
    <h1>수기 입력 vs AI 보조 측정</h1>
    ${flash ? `<div class="card" style="border-color:var(--pass)">${esc(flash)}</div>` : ""}
    <div class="card"><div><b>측정자</b> ${esc(S.person)} · <b>목표</b> AI 보조 ÷ 수기 ≤ ${S.target_ratio} ${S.locked ? '<span class="chip none">잠김</span>' : ""}</div>
      <div class="muted">진행: ${S.done} / ${S.total}</div></div>
    <div class="card"><h2>먼저 연습해 보세요 (기록하지 않습니다)</h2>
      <p class="small muted">입력 방법과 화면에 익숙해지는 용도입니다. 연습한 시간과 값은 저장되지 않습니다.</p>
      <div><button data-practice="${MANUAL}">수기 입력 연습</button> <button data-practice="${ASSISTED}">AI 보조 연습</button></div></div>
    ${days}
    <div class="card"><h2>결과 보기</h2>
      <p class="small muted">수기와 AI 보조를 둘 다 마친 서류가 한 장 이상 있어야 계산됩니다. 8장을 모두 마친 뒤에 보시는 것을 권합니다.</p>
      <div><button class="primary" id="report">결과 계산</button></div><div id="reportOut"></div></div>`;
  flash = "";
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => openTask(b.dataset.start, false));
  app.querySelectorAll("[data-redo]").forEach(b => b.onclick = () => openTask(b.dataset.redo, false));
  app.querySelectorAll("[data-practice]").forEach(b => b.onclick = () => openTask(S.practice + "|" + b.dataset.practice, true));
  document.getElementById("report").onclick = async () => {
    const out = document.getElementById("reportOut");
    try { const r = await api("/api/report", {}); out.innerHTML = `<pre>${esc(r.text)}</pre><p class="small muted">저장: ${esc(r.path)}</p>`; }
    catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
}

/* ---------- 작업 ---------- */
async function openTask(id, practice) {
  const [doc, method] = id.split("|");
  const t = S.tasks.find(x => x.id === id);
  try {
    const data = await api(`/api/task?doc=${encodeURIComponent(doc)}&method=${encodeURIComponent(method)}`);
    const d = data.draft;
    cur = { doc, method, practice, phase: "ready", acc: 0, startAt: 0, warn: t && t.warn && !t.done ? t.other_done_hours : null,
      fields: d ? { supplier: d.fields.supplier.value, date: d.fields.date.value } : { supplier: "", date: "" },
      draft: d, confirming: false, err: "",
      rows: d ? d.rows.map(r => ({ ...r })) : Array.from({ length: 6 }, () => ({ src: null, item: "", qty: "", unit_price: "", amount: "" })) };
    task();
  } catch (e) { flash = e.message; home(); }
}

function task() {
  const app = document.getElementById("app");
  const isA = cur.method === ASSISTED;
  const label = `${cur.doc.replace("명세서_", "명세서 ")} · ${isA ? "AI 보조" : "수기 입력"}${cur.practice ? " (연습)" : ""}`;
  if (cur.phase === "ready") {
    app.innerHTML = `
      <h1>${esc(label)}</h1>
      <div class="card">
        ${cur.warn != null ? `<div class="err" style="background:var(--warn-bg);color:var(--warn)">이 서류를 다른 방식으로 ${ago(cur.warn)} 전에 쟀습니다. 기억이 남아 있을 수 있습니다.</div>` : ""}
        <h2>하는 방법</h2>
        ${isA ? `<ol><li><b>시작</b>을 누르면 서류와 AI가 만든 초안이 같이 나오고 시간이 재집니다.</li>
          <li><span style="background:var(--yellow);padding:0 6px">노란색</span> 행과 칸만 서류와 대조해 틀린 것을 고칩니다. 회색(잠김) 행은 고칠 수 없고 보지 않는 것이 약속입니다.</li>
          <li>잘못 읽어 생긴 줄은 <b>삭제</b>할 수 있습니다. 노란색이 하나도 없으면 바로 완료합니다.</li>
          <li>끝나면 <b>완료</b>를 누릅니다.</li></ol>`
        : `<ol><li><b>시작</b>을 누르면 서류와 입력 칸이 같이 나오고 시간이 재집니다.</li>
          <li>서류를 보면서 거래처, 날짜, 모든 품목 줄을 직접 입력합니다. 복사해서 붙여넣지 않습니다.</li>
          <li>합계는 입력하지 않지만 서류와 맞는지 눈으로 확인한 뒤 <b>완료</b>를 누릅니다.</li></ol>`}
        <p class="small muted">${cur.practice ? "연습이라 시간과 값은 저장되지 않습니다." : "일시정지 중에는 서류가 가려집니다. 전화나 손님 때문에 끊기면 일시정지를 누르세요."}</p>
        <div><button class="primary big" id="go">시작</button> <button id="back">돌아가기</button></div>
      </div>`;
    document.getElementById("go").onclick = () => { cur.phase = "running"; cur.startAt = Date.now(); save(); task(); startTick(); };
    document.getElementById("back").onclick = home;
    return;
  }
  const rows = cur.rows.map((r, i) => {
    const flagged = !isA || r.flagged, ro = flagged ? "" : "readonly";
    const cls = isA ? (r.flagged ? "flag" : "lock") : "";
    const cell = k => `<td><input data-i="${i}" data-k="${k}" value="${esc(r[k])}" ${ro} ${k !== "item" ? 'inputmode="decimal"' : ""} autocomplete="off"></td>`;
    return `<tr class="${cls}">${cell("item")}${cell("qty")}${cell("unit_price")}${cell("amount")}<td class="act">${
      isA ? (r.flagged ? `<button data-del="${i}">삭제</button>` : '<span class="small muted">잠김</span>') : `<button data-del="${i}" aria-label="행 삭제">✕</button>`}</td></tr>`;
  }).join("");
  const fl = k => isA && cur.draft.fields[k].flagged;
  const fieldCls = k => fl(k) ? 'style="background:var(--yellow);border-color:var(--yellow-rule)"' : "";
  const ro = k => (isA && !fl(k)) ? "readonly" : "";
  const total = isA ? `<p class="small ${cur.draft.fields.doc_total.flagged ? "" : "muted"}">AI가 읽은 문서 합계: <b>${esc(cur.draft.fields.doc_total.value || "(못 읽음)")}</b>${cur.draft.fields.doc_total.flagged ? ' <span class="chip warn">확인 필요</span>' : ""} (이 값은 저장하지 않습니다)</p>` : "";
  app.innerHTML = `
    <div class="bar"><div><b>${esc(label)}</b></div>
      <div class="timer" id="timer">${fmt(elapsed())}</div>
      <div><button id="pause">${cur.phase === "running" ? "일시정지" : "계속"}</button>
        <button class="primary" id="done">${cur.confirming ? "한 번 더 누르면 시간이 확정됩니다" : "완료"}</button>
        <button id="quit" class="small">그만두기</button></div></div>
    ${cur.err ? `<div class="err">${esc(cur.err)}</div>` : ""}
    <div class="cover ${cur.phase === "paused" ? "paused" : ""}"><div class="split">
      <div><img class="doc" alt="서류" src="/api/doc/${encodeURIComponent(cur.doc)}.png"></div>
      <div class="card">
        ${isA ? '<div class="legend"><span style="background:var(--yellow)">노란색 = 고칠 행·칸</span><span style="background:var(--lock)">회색 = 잠김</span></div>' : ""}
        <label>거래처<input data-f="supplier" value="${esc(cur.fields.supplier)}" ${ro("supplier")} ${fieldCls("supplier")} autocomplete="off"></label>
        <label>날짜 (예: 2026-10-04)<input data-f="date" value="${esc(cur.fields.date)}" ${ro("date")} ${fieldCls("date")} autocomplete="off"></label>
        <div class="table-wrap"><table><thead><tr><th>품목</th><th>수량</th><th>단가</th><th>금액</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        ${isA ? "" : '<div><button id="add">+ 행 추가</button></div>'}
        ${total}
      </div></div></div>`;
  document.getElementById("pause").onclick = () => {
    if (cur.phase === "running") { cur.acc += Date.now() - cur.startAt; cur.phase = "paused"; clearInterval(tick); }
    else { cur.phase = "running"; cur.startAt = Date.now(); startTick(); }
    save(); task();
  };
  document.getElementById("quit").onclick = () => { if (cur.quitAsk) home(); else { cur.quitAsk = true; document.getElementById("quit").textContent = "저장하지 않고 나갑니다. 한 번 더"; } };
  document.getElementById("done").onclick = finish;
  const add = document.getElementById("add");
  if (add) add.onclick = () => { cur.rows.push({ src: null, item: "", qty: "", unit_price: "", amount: "" }); save(); task(); };
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { cur.rows.splice(+b.dataset.del, 1); save(); task(); });
  app.querySelectorAll("input[data-k]").forEach(inp => inp.oninput = () => { cur.rows[+inp.dataset.i][inp.dataset.k] = inp.value; save(); });
  app.querySelectorAll("input[data-f]").forEach(inp => inp.oninput = () => { cur.fields[inp.dataset.f] = inp.value; save(); });
}

function startTick() {
  clearInterval(tick);
  tick = setInterval(() => { const t = document.getElementById("timer"); if (t && cur) { t.textContent = fmt(elapsed()); } save(); }, 500);
}

async function finish() {
  if (cur.phase === "running") { cur.acc += Date.now() - cur.startAt; cur.phase = "paused"; clearInterval(tick); }
  const seconds = cur.acc / 1000;
  if (cur.practice) { flash = `연습이 끝났습니다. 걸린 시간 ${Math.round(seconds)}초. 연습이라 저장하지 않았습니다.`; return home(); }
  if (!cur.confirming) { cur.confirming = true; cur.err = ""; save(); return task(); }
  try {
    const res = await api("/api/complete", { doc: cur.doc, method: cur.method, seconds, fields: cur.fields,
      rows: cur.rows.map(r => ({ src: r.src, item: r.item, qty: r.qty, unit_price: r.unit_price, amount: r.amount })) });
    S = res.state; flash = `저장했습니다: ${cur.doc} · ${cur.method === MANUAL ? "수기" : "AI 보조"} ${Math.round(seconds)}초` + (cur.method === ASSISTED ? `, 고친 칸 ${res.fixed}개` : "");
    home();
  } catch (e) { cur.err = e.message; cur.confirming = false; cur.phase = "paused"; save(); task(); }
}

/* ---------- 시작 ---------- */
(async function boot() {
  try { S = await api("/api/state"); } catch (e) {
    const viaFile = location.protocol !== "http:";
    document.getElementById("app").innerHTML = `<div class="err"><b>${esc(e.message)}</b>${viaFile ? "<br>이 화면은 파일로 직접 열려 있어서 동작하지 않습니다. 반드시 앱을 실행한 뒤 http://127.0.0.1:8765/ 주소로 여세요." : ""}</div>`;
    return;
  }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {  // 새로고침으로 날아간 작업을 일시정지 상태로 이어서 한다
      const c = JSON.parse(raw);
      if (c && c.doc && c.phase !== "ready") {
        if (c.phase === "running") c.acc += Math.max(0, (c.lastTick || Date.now()) - c.startAt);
        c.phase = "paused"; c.confirming = false; c.quitAsk = false; c.err = "";
        cur = c; task(); return;
      }
    }
  } catch (e) {}
  home();
})();
</script>
</body>
